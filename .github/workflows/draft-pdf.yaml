name: Draft PDF

# Compiles inst/paper/paper.md with the Open Journals toolchain, the same one
# JOSS runs on submission. Triggered by changes to the paper itself and
# manually, so ordinary code pushes do not queue a build.
on:
  push:
    paths:
      - 'inst/paper/**'
      - '.github/workflows/draft-pdf.yaml'
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: inst/paper/paper.md

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: inst/paper/paper.pdf
