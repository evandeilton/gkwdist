url: https://evandeilton.github.io/gkwdist/

template:
  bootstrap: 5
  bootswatch: minty

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/evandeilton/gkwdist
      aria-label: GitHub

logo:
  src: man/figures/gkwdist.png
  alt: "gkwdist logo"
  width: 120px

reference:
  - title: "Package Overview"
    desc: "Scope, the nested family hierarchy, and worked estimation workflows"
    contents:
      - gkwdist-package

  - title: "Utility Functions"
    desc: "Helper functions for parameter initialization"
    contents:
      - gkwgetstartvalues

  - title: "Generalized Kumaraswamy (GKw) - Distribution"
    desc: "Density, CDF, quantile, and random generation (α, β, γ, δ, λ)"
    contents:
      - dgkw
      - pgkw
      - qgkw
      - rgkw

  - title: "Generalized Kumaraswamy (GKw) - Inference"
    desc: "Log-likelihood, gradient, and Hessian"
    contents:
      - llgkw
      - grgkw
      - hsgkw

  - title: "Beta-Kumaraswamy (BKw) - Distribution"
    desc: "Density, CDF, quantile, and random generation (α, β, γ, δ) — GKw with λ = 1"
    contents:
      - dbkw
      - pbkw
      - qbkw
      - rbkw

  - title: "Beta-Kumaraswamy (BKw) - Inference"
    desc: "Log-likelihood, gradient, and Hessian"
    contents:
      - llbkw
      - grbkw
      - hsbkw

  - title: "Kumaraswamy-Kumaraswamy (KKw) - Distribution"
    desc: "Density, CDF, quantile, and random generation (α, β, δ, λ) — GKw with γ = 1"
    contents:
      - dkkw
      - pkkw
      - qkkw
      - rkkw

  - title: "Kumaraswamy-Kumaraswamy (KKw) - Inference"
    desc: "Log-likelihood, gradient, and Hessian"
    contents:
      - llkkw
      - grkkw
      - hskkw

  - title: "Exponentiated Kumaraswamy (EKw) - Distribution"
    desc: "Density, CDF, quantile, and random generation (α, β, λ) — GKw with γ = 1, δ = 0"
    contents:
      - dekw
      - pekw
      - qekw
      - rekw

  - title: "Exponentiated Kumaraswamy (EKw) - Inference"
    desc: "Log-likelihood, gradient, and Hessian"
    contents:
      - llekw
      - grekw
      - hsekw

  - title: "McDonald (MC) - Distribution"
    desc: "Density, CDF, quantile, and random generation (γ, δ, λ) — GKw with α = β = 1"
    contents:
      - dmc
      - pmc
      - qmc
      - rmc

  - title: "McDonald (MC) - Inference"
    desc: "Log-likelihood, gradient, and Hessian"
    contents:
      - llmc
      - grmc
      - hsmc

  - title: "Kumaraswamy (Kw) - Distribution"
    desc: "Density, CDF, quantile, and random generation (α, β) — GKw with γ = 1, δ = 0, λ = 1"
    contents:
      - dkw
      - pkw
      - qkw
      - rkw

  - title: "Kumaraswamy (Kw) - Inference"
    desc: "Log-likelihood, gradient, and Hessian"
    contents:
      - llkw
      - grkw
      - hskw

  - title: "Beta - Distribution"
    desc: "Density, CDF, quantile, and random generation (γ, δ) — GKw with α = β = λ = 1; Beta(γ, δ+1)"
    contents:
      - dbeta_
      - pbeta_
      - qbeta_
      - rbeta_

  - title: "Beta - Inference"
    desc: "Log-likelihood, gradient, and Hessian"
    contents:
      - llbeta
      - grbeta
      - hsbeta

home:
  title: "gkwdist: Generalized Kumaraswamy Distribution Family"
  description: |
    Fast C++ implementation of the Generalized Kumaraswamy distribution 
    family and its seven nested sub-models for bounded continuous data.

development:
  mode: auto
